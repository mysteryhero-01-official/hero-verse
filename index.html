<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero-Verse Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0c10;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: #1f2833;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0, 240, 255, 0.25);
            width: 360px;
            text-align: center;
        }
        .auth-card h2 { color: #66fcf1; margin-bottom: 15px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #45a29e;
            background: #0b0c10;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary { background: #66fcf1; color: #000; }
        .btn-secondary { background: #45a29e; color: #000; }
        .btn-google { background: #db4437; color: #fff; }
        .btn-apple { background: #000; color: #fff; border: 1px solid #fff; }
        .divider { margin: 15px 0; border-bottom: 1px solid #45a29e; }
        .toggle-link { color: #66fcf1; cursor: pointer; font-size: 13px; text-decoration: underline; margin-top: 10px; display: block; }
        
        .live-error {
            color: #ff4d4d;
            font-size: 12px;
            margin: 5px 0;
            text-align: left;
            min-height: 16px;
        }

        #home-screen { display: none; }
        navbar {
            background: #1f2833;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #66fcf1;
        }
        .logo { font-size: 20px; font-weight: bold; color: #66fcf1; }
        .profile-container { position: relative; }
        .profile-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #66fcf1;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid #fff;
        }
        .profile-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background: #1f2833;
            border: 1px solid #45a29e;
            border-radius: 8px;
            width: 230px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: left;
        }
        .profile-menu p { font-size: 13px; margin-bottom: 5px; color: #c5c6c7; }
        .owner-badge {
            background: gold;
            color: black;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }
        .btn-logout { background: #db4437; color: white; padding: 8px; margin-top: 5px; width: 100%; }
        .main-dashboard { padding: 40px 20px; text-align: center; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="card-container">
        <div class="auth-card">
            <h2>HERO-VERSE LOGIN</h2>
            <input type="text" id="login-identifier" placeholder="Email / Mobile / Handle (@username)">
            <input type="password" id="login-pass" placeholder="Password">
            <div id="login-error" class="live-error"></div>
            <button class="btn-primary" id="btn-login">Login</button>
            <div class="divider"></div>
            <span class="toggle-link" id="go-to-signup">New User? Create Account (Sign Up)</span>
        </div>
    </div>

    <!-- 2. SIGN UP SCREEN -->
    <div id="signup-screen" class="card-container" style="display:none;">
        <div class="auth-card">
            <h2>SIGN UP VERIFICATION</h2>
            <input type="email" id="signup-email" placeholder="Email Address">
            <button class="btn-primary" id="btn-email-signup">Verify Email</button>
            <div class="divider"></div>
            <input type="tel" id="signup-phone" placeholder="+91XXXXXXXXXX">
            <button class="btn-secondary" id="btn-send-otp">Send Phone OTP</button>
            <input type="text" id="otp-input" placeholder="Enter OTP" style="display:none;">
            <button class="btn-secondary" id="btn-verify-otp" style="display:none;">Verify OTP</button>
            <div id="recaptcha-container"></div>
            <div class="divider"></div>
            <button class="btn-google" id="btn-google-signup">Sign Up with Google</button>
            <button class="btn-apple" id="btn-apple-signup">Sign Up with Apple</button>
            <div id="signup-error" class="live-error"></div>
            <span class="toggle-link" id="go-to-login">Already Have Account? Login</span>
        </div>
    </div>

    <!-- 3. PROFILE SETUP FORM -->
    <div id="setup-screen" class="card-container" style="display:none;">
        <div class="auth-card">
            <h2>CREATE PROFILE</h2>
            <input type="text" id="setup-name" placeholder="Full ID Name (e.g. Naitik Pandey)">
            <input type="text" id="setup-handle" placeholder="Unique Handle (e.g. mysteryhero_01_official)">
            <input type="password" id="setup-password" placeholder="Set Password (Min 6 Chars)">
            <div id="setup-error" class="live-error"></div>
            <button class="btn-primary" id="btn-save-profile">Complete & Save Account</button>
        </div>
    </div>

    <!-- 4. HOME DASHBOARD -->
    <div id="home-screen">
        <navbar>
            <div class="logo">⚡ HERO-VERSE STUDIO</div>
            <div class="profile-container">
                <div class="profile-avatar" id="avatar-icon">N</div>
                <div class="profile-menu" id="profile-dropdown">
                    <p id="profile-name" style="color:#fff; font-weight:bold;"></p>
                    <p id="profile-handle" style="color:#66fcf1;"></p>
                    <p id="profile-email"></p>
                    <div id="owner-tag" style="display:none;" class="owner-badge">👑 PROJECT OWNER</div>
                    <button class="btn-logout" id="btn-logout">Logout</button>
                </div>
            </div>
        </navbar>

        <div class="main-dashboard">
            <h1 id="welcome-msg">Welcome to Hero-Verse!</h1>
            <p style="margin-top:10px; color:#c5c6c7;">Voltage Hero & Desi GTA Engine Control Dashboard Active.</p>
        </div>
    </div>

    <!-- FIREBASE MODULES (FIXED IMPORTS) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            GoogleAuthProvider, OAuthProvider, RecaptchaVerifier, signInWithPhoneNumber, signInWithPopup, signOut, onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdcEn5eIA4-98ydaZ9LLM10sBDsGR4Mkw",
            authDomain: "hero-verse-f53ee.firebaseapp.com",
            projectId: "hero-verse-f53ee",
            storageBucket: "hero-verse-f53ee.firebasestorage.app",
            messagingSenderId: "385086115984",
            appId: "1:385086115984:web:f9fed6cbd06fecd8d04815"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const OWNER_EMAIL = "rd8556532@gmail.com";
        const OWNER_HANDLE = "mysteryhero_01_official";
        let verifiedUser = null;

        function showError(id, msg) {
            const el = document.getElementById(id);
            if(el) el.innerText = msg;
        }

        // Toggle Screens
        document.getElementById('go-to-signup').onclick = () => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('signup-screen').style.display = 'flex';
        };
        document.getElementById('go-to-login').onclick = () => {
            document.getElementById('signup-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        };

        // Google Sign In
        document.getElementById('btn-google-signup').onclick = async () => {
            try {
                const res = await signInWithPopup(auth, new GoogleAuthProvider());
                verifiedUser = res.user;
                openSetupScreen();
            } catch (err) { showError('signup-error', err.message); }
        };

        // Email Verification Step
        document.getElementById('btn-email-signup').onclick = async () => {
            const email = document.getElementById('signup-email').value.trim();
            if(!email) return showError('signup-error', "Email daalein.");
            try {
                const res = await createUserWithEmailAndPassword(auth, email, "TempPass123!");
                verifiedUser = res.user;
                openSetupScreen();
            } catch(err) { showError('signup-error', err.message); }
        };

        function openSetupScreen() {
            document.getElementById('signup-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
            if(verifiedUser && verifiedUser.email === OWNER_EMAIL) {
                document.getElementById('setup-name').value = "Naitik Pandey";
                document.getElementById('setup-handle').value = OWNER_HANDLE;
            }
        }

        // Complete Profile
        document.getElementById('btn-save-profile').onclick = async () => {
            const name = document.getElementById('setup-name').value.trim();
            const rawHandle = document.getElementById('setup-handle').value.trim().toLowerCase();
            const password = document.getElementById('setup-password').value;

            if (!name || !rawHandle || !password) return showError('setup-error', "Saare fields bharein.");

            const handleRef = ref(db, 'handles/' + rawHandle);
            const snapshot = await get(handleRef);
            if (snapshot.exists()) return showError('setup-error', "Handle pehle se kisi ke paas hai.");

            try {
                await set(handleRef, { uid: verifiedUser.uid });
                await set(ref(db, 'users/' + verifiedUser.uid), {
                    name: name,
                    handle: rawHandle,
                    email: verifiedUser.email || "",
                    password: password,
                    role: (verifiedUser.email === OWNER_EMAIL || rawHandle === OWNER_HANDLE) ? "owner" : "user"
                });
                location.reload();
            } catch (err) { showError('setup-error', err.message); }
        };

        // Login
        document.getElementById('btn-login').onclick = async () => {
            const id = document.getElementById('login-identifier').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value;

            if(!id || !pass) return showError('login-error', "Details bharein.");

            try {
                if (id.includes("@") && id.includes(".")) {
                    await signInWithEmailAndPassword(auth, id, pass);
                } else {
                    const cleanHandle = id.replace("@", "");
                    const handleSnap = await get(ref(db, 'handles/' + cleanHandle));
                    if (handleSnap.exists()) {
                        const uid = handleSnap.val().uid;
                        const userSnap = await get(ref(db, 'users/' + uid));
                        const userData = userSnap.val();
                        if (userData && userData.email) {
                            await signInWithEmailAndPassword(auth, userData.email, pass);
                        } else { showError('login-error', "Email se login karein."); }
                    } else { showError('login-error', "Handle nahi mila."); }
                }
            } catch (err) { showError('login-error', "Galat Password ya Login Details."); }
        };

        // Auth Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userSnap = await get(ref(db, 'users/' + user.uid));
                if (!userSnap.exists()) {
                    verifiedUser = user;
                    openSetupScreen();
                    return;
                }

                const data = userSnap.val();
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('signup-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('home-screen').style.display = 'block';

                document.getElementById('profile-name').innerText = data.name;
                document.getElementById('profile-handle').innerText = "@" + data.handle;
                document.getElementById('profile-email').innerText = data.email || "";
                document.getElementById('avatar-icon').innerText = data.name.charAt(0).toUpperCase();
                document.getElementById('welcome-msg').innerText = "Welcome back, " + data.name + "! ⚡";

                if (data.role === "owner" || data.email === OWNER_EMAIL) {
                    document.getElementById('owner-tag').style.display = 'inline-block';
                }
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('home-screen').style.display = 'none';
            }
        });

        // Avatar Click Dropdown
        document.getElementById('avatar-icon').onclick = () => {
            const menu = document.getElementById('profile-dropdown');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        };

        // Logout
        document.getElementById('btn-logout').onclick = () => {
            signOut(auth).then(() => location.reload());
        };
    </script>
</body>
                </html>
